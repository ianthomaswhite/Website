<article class="resume-page">
    <h1>Resume &amp; Curriculum Vitae</h1>

    <div class="resume-download-bar no-print">
        <div class="resume-download-title">Download Options &amp; Export</div>
        <div class="resume-buttons">
            <a href="/pdfs/resume-onepage.pdf" class="btn btn-accent" download="Ian_Thomas_White_Resume_1Page.pdf">
                <span>&darr;</span> Download 1-Page Resume (PDF) <span class="resume-badge">LaTeX</span>
            </a>
            <a href="/pdfs/resume-full.pdf" class="btn" download="Ian_Thomas_White_Resume_Full.pdf">
                <span>&darr;</span> Download Full Resume (PDF) <span class="resume-badge">Extended</span>
            </a>
            <button onclick="window.print()" class="btn">
                <span>&#9113;</span> Print / Save as PDF
            </button>
        </div>
    </div>

    <div class="resume-body">
        $body$
    </div>
</article>
