<article class="post">
    <header class="post-header">
        <h1>$title$</h1>
        <div class="post-meta">
            <time datetime="$date$">$date$</time>
            $if(tags)$
            &middot; <span class="post-tags">Tags: $tags$</span>
            $endif$
        </div>
    </header>

    <div class="post-body">
        $body$
    </div>

    <hr>
    <div style="margin-top: 1.5rem;">
        <a href="/blog.html" class="btn">&larr; Back to all posts</a>
    </div>
</article>
