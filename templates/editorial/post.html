<!--
  templates/editorial/post.html
  =============================
  Individual article view template for thoughts/posts (/posts/<slug>.html).
  Features:
    - Article <h1> title
    - Publication date under the title
    - Article body prose
    - Divider and back navigation link to /thoughts.html
-->
<article class="page-content">
    <h1>$title$</h1>
    <div class="post-date" style="margin-bottom: 2.5rem;">
        <time datetime="$date$">$date$</time>$if(tags)$ &middot; $tags$$endif$
    </div>

    <div class="post-prose">
        $body$
    </div>

    <hr>
    <div style="margin-top: 2rem;">
        <a href="/thoughts">&larr; Back to Thoughts</a>
    </div>
</article>
