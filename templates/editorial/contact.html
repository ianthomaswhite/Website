<!--
  templates/editorial/contact.html
  ================================
  Contact form page template (/contact.html).
  Features:
    - Minimalist design: zero box outlines, only vertical indicator lines on the left.
    - Black indicator line default, yellow accent when active/focused.
    - Integrated with FormSubmit backend (submits to ianthomaswhite@gmail.com).
    - Send button styled flush with the labels and indicator lines above.
-->
<article class="page-content">
    <h1>Contact</h1>

    <div class="contact-form-container">
        $if(body)$
        $body$
        $endif$

        <form class="contact-form" action="https://formsubmit.co/ianthomaswhite@gmail.com" method="POST">
            <!-- Hidden configuration for FormSubmit -->
            <input type="hidden" name="_subject" value="New inquiry from ianthomaswhite.com">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-input" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-textarea" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Send</button>
        </form>
    </div>
</article>
