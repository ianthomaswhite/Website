<!--
  templates/editorial/archive.html
  ================================
  Thoughts archive page template (/thoughts.html).
  Iterates over the list of posts and applies
  the post-list.html partial snippet for each post.
-->
<article class="page-content">
    <h1>Thoughts</h1>

    <ul class="post-list-editorial">
        $for(posts)$
            $partial("templates/editorial/post-list.html")$
        $endfor$
    </ul>
</article>
