<article class="commentary-page">
    <header class="post-header">
        <h1>$title$</h1>
        <div class="post-meta">
            $if(bookAuthor)$<span>Author: <strong>$bookAuthor$</strong></span> &middot; $endif$
            $if(bookTitle)$<span>Work: <em>$bookTitle$</em></span> &middot; $endif$
            <time datetime="$date$">$date$</time>
        </div>
    </header>

    <div class="commentary-content">
        $body$
    </div>

    <hr>
    <div>
        <a href="/blog.html" class="btn">&larr; Back to Blog &amp; Notes</a>
    </div>
</article>
