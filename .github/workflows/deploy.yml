name: Build and Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live & Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            pandoc

      - name: Compile LaTeX Documents and Generate PDFs
        run: |
          mkdir -p pdfs

          # 1. Compile 1-Page LaTeX resume if present
          if [ -f "resume/resume-onepage.tex" ]; then
            pdflatex -interaction=nonstopmode -output-directory=pdfs resume/resume-onepage.tex || true
          fi

          # 2. Compile Full CV LaTeX document if present
          if [ -f "resume/cv-full.tex" ]; then
            pdflatex -interaction=nonstopmode -output-directory=pdfs resume/cv-full.tex || true
            cp -f pdfs/cv-full.pdf pdfs/resume-full.pdf 2>/dev/null || true
          fi

          # 3. Compile any papers found in papers/
          find papers -name "*.tex" -exec pdflatex -interaction=nonstopmode -output-directory=pdfs {} + 2>/dev/null || true

          # Clean up LaTeX aux/log files from pdfs folder
          rm -f pdfs/*.aux pdfs/*.log pdfs/*.out

      - name: Setup Haskell Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.7'
          cabal-version: 'latest'

      - name: Cache Cabal Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('website.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Build Hakyll Site Generator
        run: |
          cabal v2-update
          cabal v2-build site
          cabal v2-run site -- build

      - name: Bundle PDFs and CNAME into _site
        run: |
          mkdir -p _site/pdfs
          cp -r pdfs/*.pdf _site/pdfs/ 2>/dev/null || true
          cp CNAME _site/CNAME

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
