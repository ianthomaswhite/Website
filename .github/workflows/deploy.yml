name: Build and Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live & Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            pandoc

      - name: Compile LaTeX Documents and Generate PDFs
        run: |
          chmod +x scripts/build-resumes.sh
          ./scripts/build-resumes.sh

      - name: Setup Haskell Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.7'
          cabal-version: 'latest'

      - name: Cache Cabal Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('website.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Build Cabal Dependencies
        run: |
          cabal v2-update
          cabal v2-build --only-dependencies site

      - name: Build Hakyll Site Generator
        run: |
          cabal v2-build site

      - name: Compile Site with Hakyll
        run: |
          cabal v2-run site -- build

      - name: Bundle PDFs and CNAME into _site
        run: |
          mkdir -p _site/pdfs
          cp -a pdfs/. _site/pdfs/
          cp CNAME _site/CNAME

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
