# ==============================================================================
# Website Publish Manifest (sync-manifest.conf)
# ==============================================================================
# Define which private files should be synced and published to the website.
#
# Syntax:
#   <path-to-private-file> -> <destination-in-website-repo>
#
# Examples (uncomment and adjust when you are ready to link files):
#   ~/Projects/Career/resume.tex       -> resume/resume-onepage.tex
#   ~/Projects/Papers/laryngeals.tex   -> papers/linguistics/laryngeals.tex
#   ~/Projects/Writing/essay.tex       -> papers/essays/essay.tex
#
# Paths starting with '~' will automatically expand to your home directory.
# Only files listed below will be copied into this repository.
# ==============================================================================

~/Records/documents/professional/cv/base_resume.tex -> resume/resume-onepage.tex
~/Records/documents/academic/samples -> papers/academic
~/Records/documents/creative/samples -> papers/creative
~/Records/documents/academic/linguistics/ucla/ling_200B/ling-200b-2.cls -> papers/academic/linguistics/ling-200b-2.cls
