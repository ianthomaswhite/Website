# ==============================================================================
# Website Publish Manifest (sync-manifest.conf)
# ==============================================================================
# Define which private files should be synced and published to the website.
#
# Syntax:
#   <path-to-private-file> -> <destination-in-website-repo>
#
# Examples (uncomment and adjust when you are ready to link files):
#   ~/Projects/Career/custom.tex       -> custom.tex
#
# Paths starting with '~' will automatically expand to your home directory.
# Only files listed below will be copied into this repository.
